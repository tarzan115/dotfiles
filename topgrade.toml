[misc]
# ponytail: pi self-update managed elsewhere; step "pi" also covers extensions
# use PI_SKIP_VERSION_CHECK instead to keep extension updates
disable = ["pi"]

[commands]
"Update flake inputs" = "bash ~/dotfiles/nixos/update-flake.sh"
"Rebuild system" = "sudo nixos-rebuild switch --flake ~/dotfiles/nixos"
# Tools not in nixpkgs are cargo-managed (see ~/.cargo/bin); leaf ships its
# own checksum-verified updater.
"Update leaf" = "leaf --update"
